name: cd

on:
  push:
    branches: [main]
 
jobs:      
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"

      - name: Build code
        run: ./scripts/buildprod.sh

      - name: 'gcloud auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v3'
      
      - name: 'Push to Google'
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/gen-lang-client-0834109200/notely-ar-repo/notely:latest .

      - name: Setup Goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Run Migrations
        run: ./scripts/migrateup.sh

      - name: 'Deploy to Cloud Run'
        run: gcloud run deploy notely --image us-central1-docker.pkg.dev/gen-lang-client-0834109200/notely-ar-repo/notely:latest --region us-central1 --allow-unauthenticated --project gen-lang-client-0834109200 --max-instances=4
